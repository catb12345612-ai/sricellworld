        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #050505; /* Fallback deep dark */
            -webkit-font-smoothing: antialiased;
            color: #e5e5e5;
        }
        
        /* Slider Styles */
        .slide { transition: opacity 1.5s ease-in-out, transform 3s ease-in-out; opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.05); }
        .slide.active { opacity: 1; z-index: 10; transform: scale(1); }
        .slider-container { position: relative; width: 100%; height: 420px; overflow: hidden; border-radius: 1.8rem; }
        
        .hidden-contact { display: none; }
        
        /* Ultra-Premium Dark Glassmorphism */
        .glass-card {
            background: rgba(15, 15, 15, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Custom Toast Notification - Dark Neon */
        #toast {
            visibility: hidden; min-width: 250px; background: rgba(10, 10, 10, 0.95); color: #fff; 
            text-align: center; border-radius: 50px; padding: 16px 24px; position: fixed; z-index: 50; 
            left: 50%; bottom: 40px; transform: translateX(-50%); font-size: 15px; font-weight: 500;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(10px);
        }
        #toast.show { visibility: visible; animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), fadeout 0.5s 3.5s forwards; }
        @keyframes popIn { 0% { bottom: 0; opacity: 0; transform: translateX(-50%) scale(0.5); } 100% { bottom: 40px; opacity: 1; transform: translateX(-50%) scale(1); } }
        @keyframes fadeout { from { bottom: 40px; opacity: 1; } to { bottom: 0; opacity: 0; } }

        /* Heartbeat Animation */
        .heartbeat { animation: heartbeat 2s infinite; }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.2); }
            28% { transform: scale(1); }
            42% { transform: scale(1.2); }
            70% { transform: scale(1); }
        }
    </style>
</head>

    <script>
        // --- Dark Background Slideshow Logic ---
        const bgImages = [

            'https://images.unsplash.com/photo-1550009158-9ff16e0e37a2?q=80&w=2000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=2000&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1601784551446-20c9e07cd562?q=80&w=2000&auto=format&fit=crop'
        ];
        
        const bg1 = document.getElementById('bg-1');
        const bg2 = document.getElementById('bg-2');
        let currentBgIndex = 0;
        let activeBgLayer = 1;

        // Set initial background
        bg1.style.backgroundImage = `url('${bgImages[0]}')`;

        // Change background seamlessly every 10 seconds
        setInterval(() => {
            currentBgIndex = (currentBgIndex + 1) % bgImages.length;
            if (activeBgLayer === 1) {
                bg2.style.backgroundImage = `url('${bgImages[currentBgIndex]}')`;
                bg2.classList.remove('opacity-0');
                bg2.classList.add('opacity-100');
                bg1.classList.remove('opacity-100');
                bg1.classList.add('opacity-0');
                activeBgLayer = 2;
            } else {
                bg1.style.backgroundImage = `url('${bgImages[currentBgIndex]}')`;
                bg1.classList.remove('opacity-0');
                bg1.classList.add('opacity-100');
                bg2.classList.remove('opacity-100');
                bg2.classList.add('opacity-0');
                activeBgLayer = 1;
            }
        }, 10000);

        // --- Slider Logic ---
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 6000); 

        // --- Toggle Contacts Logic ---
        function toggleContacts() {
            const contactList = document.getElementById('contact-list');
            if (contactList.style.display === 'none' || contactList.style.display === '') {
                contactList.style.display = 'block';
                contactList.animate([{opacity: 0, transform: 'translateY(-15px)'}, {opacity: 1, transform: 'translateY(0)'}], {duration: 400, easing: 'ease-out', fill: 'forwards'});
            } else {
                contactList.animate([{opacity: 1, transform: 'translateY(0)'}, {opacity: 0, transform: 'translateY(-10px)'}], {duration: 300, easing: 'ease-in', fill: 'forwards'}).onfinish = () => {
                    contactList.style.display = 'none';
                };
            }
        }

           "Very fast service, there's a great collection of genuine accessories.",
          "They have a massive collection, you're going to love their phone cases.",
          "The best place to buy, they're selling authentic Apple products.",
          "Excellent repair service, it's done in just one hour.",
          "Super helpful staff, here's a very clean store environment.",
          "I got a free screen protector, it's perfect for my new phone.",

"I am very happy, there're so many budget-friendly options available.",

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 4000);
        }

        function leaveReview(url) {
            const randomComment = reviews[Math.floor(Math.random() * reviews.length)];
            
            navigator.clipboard.writeText(randomComment).then(() => {
                showToast();
                setTimeout(() => {
                    window.open(url, '_blank');
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                window.open(url, '_blank');
